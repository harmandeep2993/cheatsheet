[project]
name = "common"
version = "0.1.0"
description = "Shared infrastructure code for all services: logging, request IDs, health checks, base settings"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic-settings>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
