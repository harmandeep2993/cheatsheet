[project]
name = "chat-service"
version = "0.1.0"
description = "Answers questions using documents fetched from documents-service and an LLM"
requires-python = ">=3.12"
dependencies = [
    "common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "anthropic>=1.0",
    "pydantic-settings>=2.3",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_service"]
