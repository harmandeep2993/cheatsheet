# Single public entry point (port 8080). The browser only ever talks to this server:
#   /api/documents/...  -> documents-service
#   /api/chat/...       -> chat-service
#   everything else     -> frontend (static React build)
# Same origin for pages and API, so the browser needs no CORS rules.

server {
    listen 8080;
    client_max_body_size 1m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # One ID per request; the services log it and pass it on to each other
    proxy_set_header X-Request-ID $request_id;

    # The trailing slash on proxy_pass strips the prefix: /api/documents/search -> /search
    location /api/documents/ {
        proxy_pass http://documents-service:8000/;
    }

    location /api/chat/ {
        proxy_pass http://chat-service:8000/;
        # LLM answers can take a while
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}
