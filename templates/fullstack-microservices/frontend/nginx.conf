# Serves the built React app inside the frontend container.
# Unknown paths fall back to index.html so client-side routes work after a page refresh.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # Vite puts a content hash in asset file names, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
