[project]
name = "pocket-guide-examples"
version = "0.1.0"
description = "Runnable examples for the pocket guide: LLM basics, a tool-using agent, a RAG chatbot API and an MCP server"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.60",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "mcp>=1.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
