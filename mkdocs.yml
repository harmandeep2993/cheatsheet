site_name: Pocket Guide
site_description: Complete pocket guide for data, AI engineering and deployment
site_url: https://harmandeep2993.github.io/pocket-guide/
repo_url: https://github.com/harmandeep2993/pocket-guide
repo_name: harmandeep2993/pocket-guide
edit_uri: edit/main/

# Guides live in the repo root; tools/prepare_site.py copies them here before building
docs_dir: _site_src
site_dir: _site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

# More line spacing, section dividers and a shaded summary box (site_assets/stylesheets/extra.css)
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.magiclink
  - toc:
      permalink: true
      # GitHub-style anchors so the Contents links work on GitHub and on the site
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

validation:
  links:
    anchors: warn

