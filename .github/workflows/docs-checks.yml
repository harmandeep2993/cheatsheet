name: Docs checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: Structure, links between guides, anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check guides
        run: python tools/check_docs.py
      - name: Check glossary is up to date
        run: python tools/build_glossary.py --check
      - name: Check Previous / Next navigation is up to date
        run: python tools/build_nav.py --check

  markdownlint:
    name: Markdown style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20

  site:
    name: Site builds without warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: python tools/prepare_site.py
      - name: Strict build (fails on broken internal links or anchors)
        run: mkdocs build --strict
