name: Link check

on:
  push:
    branches: [main]
    paths: ["**.md", "lychee.toml"]
  schedule:
    - cron: "0 6 * * 1"          # every Monday 06:00 UTC: official docs move over time
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress './*.md' './examples/**/*.md'
          fail: false

      - name: Open an issue when the weekly run finds dead links
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Dead links found in the pocket guide
          content-filepath: ./lychee/out.md
          labels: docs, broken-links

      - name: Fail on dead links (push / manual runs)
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'schedule'
        run: exit 1
